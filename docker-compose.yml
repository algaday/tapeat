version: '3.8'
services:
  postgres:
    image: postgres:13
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tapeat']
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      POSTGRES_USER: tapeat
      POSTGRES_PASSWORD: change-in-production
      POSTGRES_DB: tapeat
    volumes:
      - tapeat-postgres-data:/var/lib/postgresql/data
    networks:
      - tapeat

  tapeat:
    image: tapeat
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports: 
      - 3333:3333
    env_file:
      - .env
    networks:
      - tapeat

volumes:
  tapeat-postgres-data:

networks:
  tapeat:
    name: tapeat
    driver: bridge
